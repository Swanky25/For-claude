name: Deal Alert

on:
  schedule:
    - cron: "17 0,12,16,20 * * *"   # ~8am, 12pm, 4pm, 8pm US Eastern (7/11/3/7 during winter)
  workflow_dispatch: {}

permissions:
  contents: write   # to commit state.json (remembers what was already alerted)

concurrency:
  group: deal-alert
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: deal-alert
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Check deals and send alerts
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
        run: python -m deal_alert
      - name: Save alert history
        run: |
          git config user.name "deal-alert-bot"
          git config user.email "deal-alert-bot@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || (git commit -m "deal-alert: update alert history" && git push)
