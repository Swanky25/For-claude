# Deal Alert configuration.
# A product is alerted only when it passes EVERY global rule below plus the
# rules of its category. Edit freely; no code changes needed.

[global]
country_domain = "amazon.com"    # Amazon storefront to search
currency = "$"
min_discount_pct = 40            # you asked for 40-50%+ off the list price
min_rating = 4.0                 # "best ones": well rated...
min_reviews = 100                # ...by enough buyers to trust the rating
pages_per_query = 2              # Amazon result pages to scan per search
top_n_per_category = 5           # max alerts per category per run
realert_drop_pct = 5             # re-alert an already-sent deal if it gets this much cheaper
request_delay_seconds = 4        # be polite between requests

# Community deal feeds (RSS/Atom). Items are matched to categories by keyword.
# They carry no star rating, so they are labelled "community deal" in alerts.
community_feeds = [
  "https://slickdeals.net/newsearch.php?mode=frontpage&searcharea=deals&searchin=first&rss=1",
]

[[category]]
name = "Vacuum cleaner"
queries = ["vacuum cleaner", "robot vacuum cleaner", "wet and dry vacuum cleaner", "cordless vacuum cleaner"]
must_match_any = ["vacuum"]
exclude = ["bag", "spare", "replacement", "brush roll", "side brush", "hose", "nozzle", "accessor", "compatible", "hepa filter", "filter for", "kit for", "cover for"]
min_price = 50

[[category]]
name = "Mop"
queries = ["spin mop with bucket", "steam mop", "electric spin mop", "cordless wet dry vacuum mop"]
must_match_any = ["mop"]
exclude = ["refill", "replacement", "pad only", "head only", "refill pad", "mop pads", "spare", "compatible"]
min_price = 15

[[category]]
name = "TV 50 inch and above"
queries = ["50 inch smart tv", "55 inch 4k smart tv", "65 inch smart tv", "75 inch smart tv"]
must_match_any = ["tv", "television"]
exclude = ["mount", "stand", "remote", "cover", "bracket", "cable", "screen guard", "protector", "trolley"]
min_screen_inches = 50
min_price = 150

[[category]]
name = "Water filter"
queries = ["reverse osmosis water filter system", "under sink water filter", "water filter pitcher", "faucet water filter", "whole house water filter"]
must_match_any = ["water filter", "filtration", "reverse osmosis", "purifier"]
exclude = ["replacement", "refill", "cartridge", "membrane", "spare", "compatible", "pack of", "filters only", "fridge filter", "refrigerator water filter", "shower head", "adapter"]
min_price = 20
